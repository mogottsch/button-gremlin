name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
      LOG_PRETTY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm --dir web install --frozen-lockfile
      - name: Install voice test audio dependency
        # WAV playback uses the real FFmpeg pipeline, as in the Docker runtime.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
      - run: pnpm test && pnpm --dir web test && pnpm typecheck && pnpm lint && pnpm --dir web lint && pnpm build:all
        env:
          TEST_SCRATCH_DIR: ${{ runner.temp }}/bg-auth
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Allow the exact HTTPS Activity proxy fixture origin
        # The cookie/SDK regression uses port 443; the hosted runner blocks it by default.
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - run: pnpm --dir web test:e2e
        env:
          TEST_SCRATCH_DIR: ${{ runner.temp }}/bg-auth
  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ false }} # Public legacy destination disabled; coordinated private ARC route owns publication.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Main/tags/PRs verify only; private publication is separately coordinated.
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            button-gremlin-ci:verify
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise the built image runtime and native audio decoder
        # No registry push, live credentials, Discord login or production storage.
        run: |
          docker run --rm \
            -v "$PWD/src/services/runtime.test.mjs:/app/runtime.test.mjs:ro" \
            -v "$PWD/tests/image-smoke.mjs:/app/image-smoke.mjs:ro" \
            --entrypoint node button-gremlin-ci:verify \
            --test runtime.test.mjs image-smoke.mjs
